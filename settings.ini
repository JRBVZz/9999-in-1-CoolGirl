; ============================================================
;  CoolGirl multi-ROM builder — пользовательский конфиг
;  Версия: V5.22.6
;
;  Это единственный файл, который нужно править вручную для
;  настройки сборки. Все архитектурные параметры (RAM-карта,
;  банковая раскладка) остаются в config.py и не выводятся сюда.
;
;  Формат:
;    ; — комментарий до конца строки
;    ключ = значение
;    Числа: десятичные (15) или hex ($1F или 0x1F)
;    Bool:  1 = да, 0 = нет
;
;  Если файл отсутствует или ключ не задан — используется
;  значение по умолчанию из config.py.
; ============================================================


[output]
; Имя итогового ROM-файла БЕЗ расширения.
; К нему прибавится .nes или .bin в зависимости от format.
name = coolgirl_multi

; Формат итогового файла:
;   nes  = .nes-файл с заголовком NES 2.0 (для эмуляторов и flashcart)
;   bin  = сырой дамп для прошивки во flash напрямую
format = nes


[roms]
; Папка с .nes файлами игр, которые войдут в меню.
; Сканируется рекурсивно.
dir = roms

; Имя оригинального ROM, из которого берётся меню (заставка, музыка,
; графика). Должен лежать в корне проекта.
source = 9999 in 1.nes

; База CRC32-фиксов (mapper override, mirroring, battery, флаги
; совместимости PAL/Dendy). Применяется к каждой игре по её CRC32.
nes_fixes = nes-fixes.json

; Список игр — задаёт порядок и кастомные имена в меню.
;
;   none - не использовать (все .nes из roms/ в алфавитном порядке)
;   txt  - текстовый список (games.list, формат: filename | menu_name)
;   csv  - таблица для Excel/LibreOffice (games.csv: filename,menu_name)
;
; Файл всегда называется games.list или games.csv и лежит в папке
; рядом с этим settings.ini. Если файла нет, при первом запуске билдер
; создаст шаблон из содержимого папки roms/.
list = none


[menu]
; Режим длины имён игр в меню:
;   1 = короткие имена, ровно 11 символов (как в оригинале)
;   2 = длинные имена до 48 символов, с прокруткой длинных строк
name_mode = 2

; Максимальная длина имени (актуально только при name_mode = 2).
; Жестко зашитый лимит — 48.
name_max = 48

; Сколько символов имени видно в меню одновременно.
; Если имя длиннее, оно прокручивается (если включён marquee).
name_visible = 11


[marquee]
; Прокрутка длинных имён в строке игры.
; 1 = включить, 0 = выключить.
enabled = 1

; Скорость прокрутки: количество кадров между сдвигами.
; Меньше = быстрее. Допустимо 1..255. Разумно: 8..30.
speed = 15


[font]
; Подмена тайлов CHR оригинального меню для добавления кириллицы
; или других символов.
; 1 = включить, 0 = выключить.
patch = 1

; INI-файл с описанием раскладки кастомного шрифта.
; См. font_patch.ini в этой же папке.
file = font_patch.ini

; Автоматически создавать multi_alt.ini при первой сборке если его нет.
; multi_alt.ini нужен только если хочешь добавить СВОИ символы сверх базовой
; таблицы (33 кириллицы + & + 15 спецов = 48 кастомов уже встроены).
;   1 = создать шаблон при первой сборке
;   0 = не создавать, без шаблона (если файла нет — multi_alt просто
;       работает с базовой таблицей)
; Если папка tiles/ существует — шаблон НЕ создаётся (drop-in достаточно).
auto_generate_ini = 0

; Папка с drop-in PNG-тайлами кастомов (V5.24+).
; Любой 8×8 ч/б PNG в этой папке автоматически становится кастомным тайлом —
; ни INI, ни font.png править не нужно. Это самый простой способ добавить
; свои символы.
;
; Имя файла = символ для использования в games.list (например ★.png).
; Для unicode-символов несовместимых с файловой системой используй U+XXXX
; (например U+2665.png = ♥, U+003F.png = ?).
;
; Подсуффикс @N после символа ограничивает экраны меню:
;   ★@13.png      — только screen 13 (страница submenu)
;   ★@5-10.png    — screens 5..10
;   ★@0,5,7.png   — экраны 0, 5, 7
;   ★@all.png     — все экраны (то же что без @)
;
; Также поддерживаются *.chr и *.bin (16 байт сырого CHR) для тонкой работы
; с готовыми NES-тайлами.
;
; Дубликаты с базовой таблицей (кириллица/спецы) перекрываются tiles/-версией.
; Пустое значение или несуществующая папка — drop-in выключен.
tiles_dir = tiles


[hardware]
; Максимальный размер картриджа во flash (МБ).
; Билдер выдаст ошибку если итоговый ROM не влезает.
; У стандартного CoolGirl V6 — 128 МБ.
max_rom_mb = 128

; Округлять размер итогового ROM до ближайшей степени двух.
; 0 = нет (минимизирует размер), 1 = да (нужно для некоторых старых программаторов).
round_to_pow2 = 0

; (V5.23: параметр min_rom_bytes удалён — никогда не активировался.
; Минимально возможный размер ROM ≈ 768 KB → next_pow2 = 1 MB,
; что заведомо больше старого default $20000.)

; (V5.22.10: параметр console_detect удалён — определение региона теперь
; происходит всегда на старте меню через cross-validation детектор.
; См. [audio] music_rate.)


[saves]
; Максимум battery-игр (сохраняющих прогресс) в сборке.
; Каждая battery-игра занимает один сохранительный слот в flash.
; Жёсткий лимит — 255.
max_save_games = 255


[build]
; Этап сборки:
;   1 = только подготовка (без service bank state-функций)
;   2 = полная сборка (рекомендуется)
stage = 2


[audio]
; Темп музыки в меню:
;   auto - совпадает с частотой кадров приставки
;          NTSC  = 60 Hz
;          PAL   = 50 Hz
;          Dendy = 50 Hz (как у экрана; нативно APU тикает ~60)
;   60   - принудительно 60 Hz на любой приставке
;   50   - принудительно 50 Hz на любой приставке
;
; Все три режима требуют точного определения консоли при старте меню
; (используется CPU-cycle counter с отключённым NMI).
music_rate = auto

; Сдвиг границы PAL/Dendy в детекторе региона (V5.24).
; Пороги больше НЕ зашиты в код — они вычисляются из модели тактов CPU
; (NTSC/PAL/Dendy) и числа кадров detect_frames. Этот ключ лишь выбирает,
; куда поставить границу между PAL и Dendy относительно их номиналов.
;
; Измеренное значение Y (при detect_frames = 8):
;   NTSC ≈ 78,  PAL ≈ 87,  Dendy ≈ 92
;
;   default - граница ровно посередине между PAL и Dendy.
;             Запас в обе стороны симметричный (PAL +2.4 / Dendy +3.4).
;             Рекомендуется в большинстве случаев.
;   safe    - граница сдвинута на ~2 единицы ВЫШЕ, к Dendy.
;             Больше запас у PAL (+4.4), но меньше у Dendy (+1.4).
;             Это НЕ «надёжнее вообще», а перекос в пользу PAL: бери,
;             только если конкретную PAL-консоль путает с Dendy.
;             На медленном кварце Dendy может уехать в PAL.
;
; При изменении detect_frames границы пересчитываются автоматически.
detect_threshold = default

; Медианный фильтр: делать 3 замера и брать средний.
; Защищает от случайных глитчей при детекции.
; Стоит 3x окно измерения (см. detect_frames) доп. задержки на ресете.
;   0 = выключен (1 замер)
;   1 = включён (3 замера, медиана)
detect_median = 1

; Окно измерения детектора в кадрах (V5.24). Больше кадров → больше
; зазор между NTSC/PAL/Dendy и устойчивее определение, но дольше
; чёрный экран на ресете (1 кадр ≈ 20 мс, при median ×3). Допустимо 4..16.
; Если ключ отсутствует — используется 8 (новый default).
detect_frames = 8
